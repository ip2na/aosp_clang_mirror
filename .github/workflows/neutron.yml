name: Check Neutron Clang Update

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: read

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */3 * * *'

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      NEUTRON_API: "https://api.github.com/repos/Neutron-Toolchains/clang-build-catalogue/releases/latest"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch latest Neutron Clang release
        id: fetch
        run: |
          RESPONSE=$(curl -fsSL "$NEUTRON_API")
          TAG=$(echo "$RESPONSE" | jq -r .tag_name)
          NAME=$(echo "$RESPONSE" | jq -r .name)
          URL=$(echo "$RESPONSE" | jq -r .html_url)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Check if already notified
        id: exists
        run: |
          TAG="${{ steps.fetch.outputs.tag }}"
          if git tag --list "neutron-${TAG}" | grep -q .; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Already up to date
        if: steps.exists.outputs.exists == 'true'
        run: echo "Neutron Clang ${{ steps.fetch.outputs.tag }} already notified, skipping."

      - name: Create tag
        if: steps.exists.outputs.exists == 'false'
        run: |
          git config user.name "anyaanasera"
          git config user.email "anyaprjkt.my.id"
          git tag "neutron-${{ steps.fetch.outputs.tag }}"
          git push origin "neutron-${{ steps.fetch.outputs.tag }}"

      - name: Telegram Notify
        if: steps.exists.outputs.exists == 'false'
        env:
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
        run: |
          TAG="${{ steps.fetch.outputs.tag }}"
          NAME="${{ steps.fetch.outputs.name }}"
          URL="${{ steps.fetch.outputs.url }}"

          cat > caption.txt <<EOF
          *Neutron Clang Update*
          $(date +'%Y-%m-%d')
          #Clang #Neutron

          *Release tag*: \`${TAG}\`
          *Version*: ${NAME}

          [Release Page](${URL})
          EOF

          curl -s -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TG_CHAT_ID}" \
            -d disable_web_page_preview=true \
            -d parse_mode=Markdown \
            --data-urlencode text@caption.txt
